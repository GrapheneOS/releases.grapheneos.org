server {
    listen 80;
    listen [::]:80;
    server_name seamlessupdate.app www.seamlessupdate.app releases.grapheneos.org apps.grapheneos.org;

    location /.well-known/acme-challenge/ {
        return 301 http://yto.grapheneos.org$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seamlessupdate.app www.seamlessupdate.app;

    ssl_certificate /etc/letsencrypt/live/releases.grapheneos.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.grapheneos.org/privkey.pem;

    include security-headers-releases.conf;

    # https://trac.nginx.org/nginx/ticket/2012
    location / {
        return 301 https://releases.grapheneos.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name releases.grapheneos.org;

    ssl_certificate /etc/letsencrypt/live/releases.grapheneos.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.grapheneos.org/privkey.pem;

    include root_releases.grapheneos.org.conf;

    keepalive_requests 64;
    keepalive_timeout 15s;

    send_timeout 2m;

    ssl_buffer_size 16k;

    open_file_cache max=2048 inactive=1d;
    open_file_cache_valid 1d;

    include security-headers-releases.conf;
    add_header Cache-Control "public";

    if ($request_uri ~ ^[^?]*//) {
        rewrite ^(.*)$ $1 permanent;
    }

    location = /security.txt {
        return 301 /.well-known/security.txt;
    }

    location = / {
        return 301 https://grapheneos.org/releases;
    }

    location = /factory.pub {
        return 410;
    }

    location = /factory.pub.asc {
        return 410;
    }

    location = /favicon.ico {
        if ($http_accept ~ "image/svg\+xml") {
            rewrite ^ /favicon.svg last;
        }
        gzip_static on;
        brotli_static on;
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.svg {
        internal;
        gzip_static on;
        brotli_static on;
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /allowed_signers {}
    location = /allowed_signers.sig {}

    location ^~ /sailfish- {
        return 410;
    }

    location ^~ /marlin- {
        return 410;
    }

    location ^~ /walleye- {
        return 410;
    }

    location ^~ /taimen- {
        return 410;
    }

    location ^~ /blueline- {
        return 410;
    }

    location ^~ /crosshatch- {
        return 410;
    }

    location ^~ /sargo- {
        return 410;
    }

    location ^~ /bonito- {
        return 410;
    }

    location = /overview.json {
        root /srv/releases;
        gzip_static on;
        brotli_static on;
        open_file_cache max=1 inactive=1d;
        open_file_cache_valid 5s;
        include security-headers-releases.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60";
        add_header X-Robots-Tag "none" always;
    }

    location ~ "^/(?:stallion|rango|mustang|blazer|frankel|tegu|comet|komodo|caiman|tokay|akita|husky|shiba|felix|tangorpro|lynx|cheetah|panther|bluejay|raven|oriole|barbet|redfin|bramble|sunfish|coral|flame)-(?:testing|alpha|beta|stable)(?:-security-preview)?$" {
        root /srv/releases;
        open_file_cache max=256 inactive=1d;
        open_file_cache_valid 5s;
        include security-headers-releases.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60";
        add_header X-Robots-Tag "none" always;
        default_type text/plain;
    }

    location ~ "\.(?:txt|xml)$" {
        gzip_static on;
        brotli_static on;
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=1800";
    }

    location ~ "\.pub$" {
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=60";
        add_header Content-Disposition "attachment";
    }

    location ~ "\.sig$" {
        root /srv/releases;
        include security-headers-releases.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition "attachment";
        add_header X-Robots-Tag "none" always;
    }

    location ~ "\.zip$" {
        root /srv/releases;
        include security-headers-releases.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "none" always;
    }

    location ~ "\.tar.xz$" {
        root /srv/releases;
        include security-headers-releases.conf;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "none" always;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apps.grapheneos.org;

    ssl_certificate /etc/letsencrypt/live/releases.grapheneos.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.grapheneos.org/privkey.pem;

    include root_apps.grapheneos.org.conf;

    keepalive_requests 64;
    keepalive_timeout 15s;

    send_timeout 2m;

    ssl_buffer_size 16k;

    open_file_cache max=2048 inactive=1d;
    open_file_cache_valid 1d;

    include security-headers-releases.conf;
    add_header Cache-Control "public";

    if ($request_uri ~ ^[^?]*//) {
        rewrite ^(.*)$ $1 permanent;
    }

    location = / {
        return 301 https://grapheneos.org/articles/grapheneos-servers#releases.grapheneos.org;
    }

    location = /metadata.0.json {
        return 410;
    }

    location = /metadata.0.json.gz {
        return 410;
    }

    location = /metadata.0.json.0.sig {
        return 410;
    }

    location = /metadata.1.0.sjson {
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=60";
        add_header X-Robots-Tag "none" always;
        gzip_static on;
        brotli_static on;
    }

    location = /staging-metadata.1.0.sjson {
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=60";
        add_header X-Robots-Tag "none" always;
        gzip_static on;
        brotli_static on;
    }

    location = /favicon.ico {
        if ($http_accept ~ "image/svg\+xml") {
            rewrite ^ /favicon.svg last;
        }
        gzip_static on;
        brotli_static on;
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.svg {
        internal;
        gzip_static on;
        brotli_static on;
        include security-headers-releases.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location /packages/ {
        include security-headers-releases.conf;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "none" always;

        location ~ \.(?:apk|apk\.idsig)$ {
            include security-headers-releases.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Robots-Tag "none" always;
            gzip_static on;
            brotli_static on;
        }

        location ~ \.(?:apk\.br|apk\.gz|fsv_sig)$ {
            include security-headers-releases.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Robots-Tag "none" always;
        }

        location ~ \.webp$ {}

        return 404;
    }

    location / {
        return 404;
    }
}
